<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>VR Taman Interaktif</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  </head>
  <body>
    <a-scene background="color: #87CEEB" shadow="type: pcfsoft">
      <!-- Kamera -->
      <a-entity position="0 2 15">
        <a-camera wasd-controls look-controls></a-camera>
      </a-entity>

      <!-- Aset Model & Suara -->
      <a-assets>
        <a-asset-item id="bench" src="assets/models/classic_park_bench_low_poly.glb"></a-asset-item>
        <a-asset-item id="lamp" src="assets/models/lamp.glb"></a-asset-item>
        <a-asset-item id="tree" src="assets/models/mango_tree_fbx.glb"></a-asset-item>
        <a-asset-item id="flower" src="assets/models/generic_tulip_flower.glb"></a-asset-item>
        <a-asset-item id="waterfall" src="assets/models/water_fall_fbx.glb"></a-asset-item>
        <a-asset-item id="birds" src="assets/models/birds.glb"></a-asset-item>
        
        <!-- Suara air terjun -->
        <audio id="waterfallSound" src="assets/sounds/waterfall.mp3" preload="auto"></audio>
      </a-assets>

      <!-- Tanah -->
      <a-plane rotation="-90 0 0" width="50" height="50" color="#228B22" shadow></a-plane>

      <!-- Pencahayaan -->
      <a-entity light="type: ambient; color: #ffffff; intensity: 0.8"></a-entity>
      <a-entity light="type: directional; intensity: 1" position="10 20 10" shadow></a-entity>

      <!-- Kursi taman -->
      <a-entity gltf-model="#bench" position="-5 1 -5" scale="0.6 0.6 0.6" shadow></a-entity>
      <a-entity gltf-model="#bench" position="5 1 -5" scale="0.6 0.6 0.6" shadow></a-entity>
      <a-entity gltf-model="#bench" position="5 1 5" scale="0.6 0.6 0.6" shadow></a-entity>
      <a-entity gltf-model="#bench" position="-5 1 5" scale="0.6 0.6 0.6" shadow></a-entity>

      <!-- Lampu -->
      <a-entity gltf-model="#lamp" position="-7 0 -7" scale="1 1 1" shadow></a-entity>
      <a-entity gltf-model="#lamp" position="7 0 -7" scale="1 1 1" shadow></a-entity>
      <a-entity gltf-model="#lamp" position="7 0 7" scale="1 1 1" shadow></a-entity>
      <a-entity gltf-model="#lamp" position="-7 0 7" scale="1 1 1" shadow></a-entity>

      <!-- Pohon -->
      <a-entity gltf-model="#tree" position="-10 2 -10" scale="1.5 1.5 1.5" shadow></a-entity>
      <a-entity gltf-model="#tree" position="10 2 -10" scale="1.5 1.5 1.5" shadow></a-entity>
      <a-entity gltf-model="#tree" position="-10 2 10" scale="1.5 1.5 1.5" shadow></a-entity>
      <a-entity gltf-model="#tree" position="10 2 10" scale="1.5 1.5 1.5" shadow></a-entity>

      <!-- Air Terjun + Suara -->
      <a-entity 
        gltf-model="#waterfall" 
        position="0 0 0" 
        scale="3 3 3"
        shadow
        sound="src: #waterfallSound; autoplay: true; loop: true; positional: true; volume: 10">
      </a-entity>

      <!-- Burung -->
      <a-entity gltf-model="#birds" position="0 10 -5" scale="0.5 0.5 0.5" animation="property: position; to: 10 10 5; dur: 8000; dir: alternate; loop: true"></a-entity>

      <!-- Bunga tulip -->
      <a-entity id="flower-container"></a-entity>
    </a-scene>

    <!-- Script generate bunga kecil -->
    <script>
      AFRAME.registerComponent('spawn-flowers', {
        init: function () {
          const container = document.querySelector('#flower-container');
          const count = 15;

          for (let i = 0; i < count; i++) {
            const flower = document.createElement('a-entity');
            flower.setAttribute('gltf-model', '#flower');
            flower.setAttribute('scale', '0.01 0.01 0.01'); // Ukuran sangat kecil
            flower.setAttribute('shadow', '');

            const x = (Math.random() - 0.5) * 40;
            const z = (Math.random() - 0.5) * 40;
            flower.setAttribute('position', `${x} 0 ${z}`);

            flower.setAttribute('animation', {
              property: 'rotation',
              dir: 'alternate',
              dur: 3000 + Math.random() * 2000,
              easing: 'easeInOutSine',
              loop: true,
              to: `0 ${Math.random() * 20 - 10} 0`
            });

            const hue = Math.floor(Math.random() * 360);
            flower.setAttribute('material', `color: hsl(${hue}, 70%, 60%)`);

            container.appendChild(flower);
          }
        }
      });

      document.addEventListener('DOMContentLoaded', () => {
        document.querySelector('#flower-container').setAttribute('spawn-flowers', '');
      });
    </script>
  </body>
</html>
